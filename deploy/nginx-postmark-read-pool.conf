# nginx-postmark-read-pool.conf — the SERVER-level half of DEC-4 / G3.
#
# PROPOSED. NOTHING HERE HAS BEEN APPLIED TO THE BOX. The lane that wrote it
# read /etc/nginx read-only and changed nothing. The diff against what is live
# today is at the bottom of this file.
#
# Installs as /etc/nginx/snippets/postmark-api.conf, REPLACING the live one —
# every location it does not mention is carried forward from that file
# unchanged, and the ones it does mention are marked in the diff.
#
# ⚑ ITS HTTP-LEVEL HALF IS A SEPARATE FILE. `upstream` and `map` cannot live
# here: this snippet is included inside a server{} block, and those are
# http-context directives. They ship as
# deploy/nginx-postmark-read-pool-upstreams.conf → /etc/nginx/conf.d/. Install
# that FIRST, or this file's `proxy_pass http://postmark_office_writer` names an
# upstream nginx has never heard of and `nginx -t` refuses the whole config.
#
# What it does: GET and HEAD under /api/ go to a pool of read-only workers;
# everything else — every POST, every PATCH, the MCP door, the OAuth dance —
# keeps going to the one writer on 4380, the only process allowed to hold a pen.

# ── the MCP door is the writer's, whatever the method ────────────────────────
#
# Ahead of everything else. The office refuses /mcp on a worker (405), so a
# misroute here would not be dangerous — but it would be a 405 in front of a
# connector at CONNECT time, and a connector that gets anything but 401 +
# resource_metadata is a connector that never offers its human the sign-in.
# Streaming, so buffering stays off and the timeout stays long.
location = /api/mcp {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://postmark_office_writer;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
}

# ── the five hot world reads: the brownout shield, now over the pool ─────────
#
# UNCHANGED FROM WHAT IS LIVE except the upstream. Every cache directive below
# is byte-for-byte the shield Wright installed on 2026-08-29 — the same key, the
# same 30 s validity, the same lock. This block is where the pool pays for
# itself, because these are the reads that cost ~1.2 s of CPU each.
#
# ⚑ AND A CORRECTION WORTH CARRYING: the live block's comment says "micro-cached
# 2s per auth token" and the directive under it says `proxy_cache_valid 200 30s`.
# The code is the truth; the comment has been wrong since the night it was
# written in a hurry. Kept as 30 s here, and the comment now agrees.
location ~ ^/api/world/(apex|conversations|walkers|state|present)$ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$postmark_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args|$http_authorization|$http_cookie";
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating timeout;
    add_header X-PM-Cache $upstream_cache_status always;
    # WHICH WORKER ANSWERED, on the wire. Behind a pool this is otherwise
    # unknowable, and it is the first thing anybody debugging a pool wants.
    add_header X-PM-Upstream $upstream_addr always;
    proxy_read_timeout 60s;
}

# ── everything else under /api/ ──────────────────────────────────────────────
#
# ⚑ `proxy_pass http://$postmark_upstream;` WITH A VARIABLE DOES NOT APPEND THE
# LOCATION-STRIPPED URI the way `proxy_pass http://127.0.0.1:4380/;` does. That
# trailing slash is what strips /api today, and it is not available here. The
# `rewrite ... break` above the proxy_pass does the stripping instead — the same
# pattern the world-cache block has used since the shield went in. Getting this
# wrong sends the office /api/town, which 404s: worth checking with
# `curl -s https://postmark.town/api/town | head -3` as the very first probe
# after a reload.
location /api/ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://$postmark_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # MCP is streamable HTTP and it is handled above; everything landing here is
    # an ordinary request, so the writer-era settings are kept unchanged.
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
    add_header X-PM-Upstream $upstream_addr always;
}

# ── NOT TOUCHED, and named so a reader knows the omission is deliberate ──────
#
# The two `/.well-known/oauth-` and `/.well-known/openid-configuration`
# locations in snippets/postmark-api.conf keep proxying straight to
# 127.0.0.1:4380. They must: `handleOauth`'s first act is `sweep(odb)` — three
# DELETEs against oauth.db — so a GET there is a write, and it is one of the
# three named holes in the office's own `workerSafe`. A worker would answer 405
# and a connector reading a 405 at discovery never offers its human a sign-in.
#
# `location = /mcp` and `= /mcp/` (the 308 courtesy redirects) are unchanged.
# `location @postmark_keyless_rate` is unchanged.

# ── THE DIFF AGAINST WHAT IS LIVE TODAY ──────────────────────────────────────
#
# Live (/etc/nginx/snippets/postmark-api.conf, read 2026-09-08):
#   - no `upstream` block anywhere in /etc/nginx
#   - the world-cache location:  proxy_pass http://127.0.0.1:4380;
#   - the general location:      proxy_pass http://127.0.0.1:4380/;   <- slash
#   - no /api/mcp location of its own; MCP falls through the general one
#
# Proposed, across the two files:
#   + two upstream blocks and one map      -> conf.d/postmark-read-pool.conf
#     (http context; they CANNOT live in this snippet, which is included inside
#      a server{} block — install that file first or `nginx -t` refuses the
#      whole config on an unknown upstream name)
#   + /api/mcp pinned to the writer, ahead of the rest
#   ~ world-cache location: upstream becomes $postmark_upstream (pool)
#   ~ general location: upstream becomes $postmark_upstream, and the trailing
#     slash is replaced by an explicit `rewrite ^/api(/.*)$ $1 break;`
#   + X-PM-Upstream on both, so an operator can see which worker answered
#
# ALREADY VERIFIED BY THE LANE THAT WROTE IT, on the box, without touching the
# live config: both files were included into a scratch nginx.conf under /tmp and
# `nginx -t` passed; then a scratch nginx was run on port 18080 with the pool
# pointed at a real `--role read` worker (4390) and the dev writer (4381), and
# every method was driven through it:
#
#   GET  /api/town      -> 200, X-PM-Upstream: 127.0.0.1:4390   (the worker)
#   HEAD /api/town      -> 200, X-PM-Upstream: 127.0.0.1:4390   (the worker)
#   GET  /api/release   -> "role": "read", "write_grant": false
#   GET  /api/world/apex-> 200, X-PM-Cache: MISS, upstream 4390 (the shield)
#   POST /api/letters   -> 401, X-PM-Upstream: 127.0.0.1:4381   (the WRITER)
#   PATCH /api/home/…   -> 401, X-PM-Upstream: 127.0.0.1:4381   (the WRITER)
#
# The two 401s are the point: they are the writer's own "no key at the door",
# not a worker's 405. The scratch nginx was stopped and port 18080 released.
#
# VERIFY AFTER A REAL RELOAD, in this order:
#   nginx -t
#   curl -s https://postmark.town/api/town | head -3          # the URI strip
#   curl -sI https://postmark.town/api/town | grep -i x-pm-upstream
#   curl -s https://postmark.town/api/release | grep -E 'role|write_grant'
#   curl -s -o /dev/null -w '%{http_code}\n' -X POST \
#        https://postmark.town/api/letters -d '{}'            # must NOT be 405
#   curl -sI https://postmark.town/api/mcp | head -1          # must be 401, not 405
#
# THE ONE THAT MATTERS MOST is the POST: if a resident's letter ever comes back
# 405 "this office reads only", the map is wrong and the pool must come out.
