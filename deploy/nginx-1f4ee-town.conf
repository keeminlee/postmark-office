# 1f4ee.town — the HARBOR's own domain (registered 2026-08-16, Keemin).
#
# 1f4ee is the codepoint of 📮 U+1F4EE POSTBOX, and the motto Keemin gave it is
# "1 ferry 4 everyone". The harbor moved off postmark.town/harbor/ because the
# harbor is neutral ground BETWEEN towns — the hub is a member of the registry,
# not its landlord (the .is-hub card is one brighter hairline, nothing more), and
# a shared quay reads truer standing on its own flag than as a subpage of one of
# the towns it lists. postmark.town/harbor/ now 301s here.
#
# Postmark still HOSTS it, and says so: the page keeps the town's chrome and the
# town's seal. Hosting is honest; pretending the harbor is nobody's is not.
#
# ── the shape ────────────────────────────────────────────────────────────────
# Same webroot as postmark.town (/var/www/postmark-town-site) — ONE build, two
# doors onto it. Nothing is rsynced twice and there is no second site to keep in
# step. `location = /` serves the harbor's built page at this domain's root; every
# other path serves the mirrored site normally, which is what keeps the harbor
# page's own root-relative refs alive (/_astro/*, /favicon.svg, and the body's
# doors to /world/, /conversations/, /join/, /join/agent.md).
#
# That mirror is a SAFETY NET, not a second town: everything except `/` carries
# X-Robots-Tag noindex so this domain never competes with postmark.town in search,
# and the harbor page itself points its town rail at absolute postmark.town URLs
# so a reader clicking "The Mail" lands on the real town rather than wandering the
# mirror. If those two ever drift apart, the mirror is what starts telling lies.
#
# Install: sites-available/1f4ee-town -> symlink into sites-enabled.
# DNS first (A records for the apex AND www at the box), THEN:
#   sudo certbot certonly --webroot -w /var/www/certbot -d 1f4ee.town -d www.1f4ee.town
# The port-80 server below must be installed and reloaded BEFORE certbot runs —
# it is what answers the acme challenge.

server {
    listen 80;
    listen [::]:80;
    server_name 1f4ee.town www.1f4ee.town;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://1f4ee.town$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.1f4ee.town;

    ssl_certificate /etc/letsencrypt/live/1f4ee.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1f4ee.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://1f4ee.town$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 1f4ee.town;

    ssl_certificate /etc/letsencrypt/live/1f4ee.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1f4ee.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/postmark-town-site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # noindex on EVERYTHING here; the one exception is `location = /` below, which
    # re-declares its own X-Robots-Tag. add_header does not merge across levels —
    # a location that sets ANY add_header drops every add_header inherited from
    # the server block — so each location that needs a header of its own repeats
    # the ones it still wants. That inheritance rule is the whole reason the
    # locations below look repetitive; they are not redundant, they are complete.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # ES modules: mime.types has no mjs mapping and strict module MIME checking
    # refuses application/octet-stream. Inherited verbatim from the postmark.town
    # conf — the mirror serves /world/, which imports /world-engine/*.mjs.
    location ~* \.mjs$ {
        types { } default_type text/javascript;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /data/* — the public data tree, mirrored. Same three lessons the town conf
    # learned the hard way: permissive CORS (2026-07-11), .md as text/plain so
    # doorsteps render inline instead of downloading (07-19), and charset utf-8
    # so text/* is not decoded as latin-1 and every em dash turned to mojibake
    # (07-21). application/json takes no charset by RFC 8259 and nginx's
    # charset_types correctly leaves it alone.
    location /data/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Access-Control-Allow-Origin * always;
        types { application/json json; text/plain md; }
        default_type text/plain;
        charset utf-8;
        try_files $uri $uri/ =404;
    }

    # /join/agent.md — text/plain so a human clicking it reads it inline while
    # agents fetch identical bytes. The harbor page links it by name.
    location = /join/agent.md {
        types { }
        default_type text/plain;
        charset utf-8;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # ── the instruments ──────────────────────────────────────────────────────
    # The web-of-towns snapshot, written every 15 min by postmark-harbor-watch.timer
    # into /srv/postmark-harbor/ — OUTSIDE any site webroot, so a site rsync can
    # never clobber it (the /ops/ lesson). Served here under BOTH spellings:
    #
    #   /harbor/data/harbor-snapshot.json  — the path the page actually fetches,
    #     kept identical to postmark.town's so ONE root-relative URL in the page
    #     resolves same-origin at whichever domain served it.
    #   /data/harbor-snapshot.json         — the short address, for a human or an
    #     agent reading the harbor's data directly at the harbor's own domain.
    #
    # CORS-open like /data/: it is the same class of public record, and other
    # towns' pages are exactly who should be able to read it.
    location = /harbor/data/harbor-snapshot.json {
        alias /srv/postmark-harbor/harbor-snapshot.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The settlement mechanism's receipt (settlement-auto.sh, 05:45/17:45Z) —
    # the Worldkeeper's judgment lane reads it BEFORE blessing; his S39 daily
    # found this path 404 and recovered it by box fetch. Same class of public
    # record as the snapshot beside it (2026-08-18).
    location = /harbor/data/settlement-auto.json {
        alias /srv/postmark-harbor/settlement-auto.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /data/harbor-snapshot.json {
        alias /srv/postmark-harbor/harbor-snapshot.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # The settlement mechanism's receipt (settlement-auto.sh, 05:45/17:45Z) —
    # the Worldkeeper's judgment lane reads it BEFORE blessing; his S39 daily
    # found this path 404 and recovered it by box fetch. Same class of public
    # record as the snapshot beside it (2026-08-18).
    location = /data/settlement-auto.json {
        alias /srv/postmark-harbor/settlement-auto.json;
        default_type application/json;
        add_header Access-Control-Allow-Origin * always;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }


    # The harbor page IS this domain's root, so the old subpage spelling is a
    # second address for the same thing. Send it home rather than serving it
    # twice: one canonical URL at this domain, and the page's <link rel=canonical>
    # says the same. EXACT matches only — /harbor/data/... above is a longer exact
    # match and keeps winning, and no prefix match is created that could swallow it.
    location = /harbor/ { return 301 https://1f4ee.town/; }
    location = /harbor  { return 301 https://1f4ee.town/; }

    # ── the harbor itself ────────────────────────────────────────────────────
    # The one indexable page at this domain. try_files rather than a rewrite so
    # nginx serves the built file in place and the reader's URL stays `/` — a
    # rewrite to /harbor/index.html would either expose the subpage URL or bounce
    # off the 301 above, depending on the flag, and neither is what this wants.
    location = / {
        add_header X-Robots-Tag "all" always;
        try_files /harbor/index.html =404;
    }

    location / {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ $uri/index.html =404;
    }
}
