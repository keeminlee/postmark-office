# nginx-postmark-read-pool-upstreams.conf — the HTTP-level half of DEC-4 / G3.
#
# PROPOSED. Nothing here has been applied to the box.
#
# Installs as /etc/nginx/conf.d/postmark-read-pool.conf, beside the two files
# that already live there for exactly this reason: conf.d/postmark-rate-limit
# .conf holds the `limit_req_zone` and conf.d/postmark-worldcache.conf holds the
# `proxy_cache_path`. `upstream` and `map` are http-context directives and
# CANNOT sit in snippets/postmark-api.conf, which is included inside a server{}
# block — an earlier draft of this lane put all of it in one file, which would
# have failed `nginx -t` at install time with a context error.

# ── the pool ─────────────────────────────────────────────────────────────────
#
# Ports are the workers' systemd instance names (postmark-office-read@4391 and
# siblings). THREE, not four: the box has 4 cores and the writer needs one, and
# the writer staying responsive for letters is the half of the 2026-08-29
# brownout that actually cost residents something.
#
# `least_conn` rather than round-robin, because an apex read is ~1.2 s and the
# manifest is ~1 ms; under round-robin a worker that drew three apex reads in a
# row keeps being handed more while a worker sitting on manifests idles.
upstream postmark_office_reads {
    least_conn;
    server 127.0.0.1:4391 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4392 max_fails=2 fail_timeout=10s;
    server 127.0.0.1:4393 max_fails=2 fail_timeout=10s;
    # THE WRITER IS THE BACKUP, and this is the line that makes the pool safe to
    # install before it is trusted: with all three workers down, reads fall back
    # to exactly today's behaviour instead of 502ing the town.
    server 127.0.0.1:4380 backup;
    keepalive 32;
}

upstream postmark_office_writer {
    server 127.0.0.1:4380;
    keepalive 16;
}

# ── which upstream a request belongs to ──────────────────────────────────────
#
# A map and not an `if`, because `if` inside a location is the directive nginx's
# own documentation warns about, and because this is what a map is for.
#
# THE DEFAULT IS THE WRITER. A method nobody has thought about yet goes to the
# process that can handle anything — the same direction the office's own
# `workerSafe` fails in, and for the same reason: a mistake must fall toward the
# writer, never toward a worker that would refuse a resident's letter.
map $request_method $postmark_upstream {
    default  postmark_office_writer;
    GET      postmark_office_reads;
    HEAD     postmark_office_reads;
}
