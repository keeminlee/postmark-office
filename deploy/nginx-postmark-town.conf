# postmark.town — the town's own domain (registered 2026-07-08, Porkbun).
# Since hub step 3.2 (2026-07-09): serves the town SITE natively at the root
# (/var/www/postmark-town-site, built by keeminlee/postmark-site's
# build + rsync'd by CI (extraction P3 flip 2026-07-27); TOWN_WEBROOT in deploy.yml). The office API
# rides the same origin at /api/* via the shared snippet.
# The interim landing (/var/www/postmark-town) is retired but left on disk.

server {
    listen 80;
    listen [::]:80;
    server_name postmark.town www.postmark.town;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://postmark.town$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.postmark.town;

    ssl_certificate /etc/letsencrypt/live/postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postmark.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://postmark.town$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name postmark.town;

    ssl_certificate /etc/letsencrypt/live/postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/postmark.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/postmark-api.conf;

    # old postmark.town/atelier/* links from the transition window
    location /atelier/ {
        return 301 https://starforge-atelier.online$request_uri;
    }

    root /var/www/postmark-town-site;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # ES modules: mime.types has no mjs mapping, and strict module MIME checking
    # refuses application/octet-stream (the /world island imports /world-engine/*.mjs).
    location ~* \.mjs$ {
        types { } default_type text/javascript;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # /data/* — the public data tree (doorstep bundles, index.json, llms.txt).
    # Same-permissive CORS as the office API: it is the same public repo data,
    # and household window panes fetch it cross-origin (file:// standalone,
    # panes.postmark.town when hung). Added 2026-07-11 (doorstep in the
    # window TEMPLATE); without it those fetches die silently in the browser.
    location /data/ {
        add_header Access-Control-Allow-Origin * always;
        # .md as text/plain (2026-07-19): browsers render doorsteps inline
        # instead of downloading, and AI fetch tools see text, not binary.
        # Only .json and .md live under /data/.
        types { application/json json; text/plain md; }
        default_type text/plain;
        # ...but text/* WITHOUT a charset is decoded as latin-1 by browsers and
        # most fetch tools, so every em dash, middle dot and ✦ in a doorstep
        # came out as mojibake (2026-07-21). The files on disk were always
        # clean UTF-8 — this was never a generator bug, only an unlabelled
        # response. The .json twin was unaffected because application/json is
        # UTF-8 by spec, which is exactly why the corruption looked ".md-only".
        # `charset` applies to nginx's charset_types, which includes text/plain
        # and does NOT include application/json — correct in both directions:
        # RFC 8259 says a JSON Content-Type should carry no charset parameter.
        charset utf-8;
        try_files $uri $uri/ =404;
    }

    # /ops/desk/ — the principal's desk (site-built page, 2026-07-19). More
    # specific than the /ops/ alias below, so it wins: the desk lives inside
    # /ops/ while the dashboards keep their home. /ops/ itself is reserved for
    # the operator hub (Keemin, 2026-07-19: "ops/ can be the hub").
    location /ops/desk/ {
        try_files $uri $uri/ =404;
    }

    # /ops/* — operator dashboards (traffic report). Unlinked, noindex; lives
    # outside the deploy webroot so site rsyncs never clobber it. 2026-07-11.
    # /ops/git/ + /ops/traffic/ — box-GENERATED dashboards (cron-written to
    # /var/www/postmark-ops/, outside the site webroot). More specific than the
    # site-served /ops/ hub below, so they keep resolving to the box. 2026-07-20.
    # slash-redirects: the box dashboards are directory aliases, so the
    # slashless spelling used to fall through to the site catch-all and 404
    # (bit Keemin on /ops/world 2026-07-31; /ops/traffic had it since birth).
    location = /ops/git     { return 301 /ops/git/; }
    location = /ops/traffic { return 301 /ops/traffic/; }
    location = /ops/world   { return 301 /ops/world/; }
    location = /ops/economy { return 301 /ops/economy/; }
    location /ops/git/ {
        alias /var/www/postmark-ops/git/;
        index index.html;
    }
    location /ops/traffic/ {
        alias /var/www/postmark-ops/traffic/;
        index index.html;
    }
    location /ops/economy/ {
        alias /var/www/postmark-ops/economy/;
        index index.html;
    }
    location /ops/world/ {
        alias /var/www/postmark-ops/world/;
        index index.html;
    }
    # /ops/ (the hub index) is now SITE-built (astro) — it falls through to the
    # catch-all `location /` and serves /var/www/postmark-town-site/ops/index.html.
    # The box old /var/www/postmark-ops/index.html is retired (shadowed). 2026-07-20.

    # /preview/<slug>/ — branch preview deploys. The office tool
    # tools/preview-deploy.mjs builds a town branch with build.assetsPrefix set
    # to /preview/<slug>/ and ships it here. noindex + nofollow so a preview
    # never leaks into search; lives outside the site webroot so site rsyncs
    # never touch it. Stale previews are removed by hand. 2026-07-20.
    location /preview/ {
        alias /var/www/postmark-preview/;
        index index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri/ =404;
    }

    # The Town Seal — served straight from the box's town clone, which the
    # ferry unit re-seals + commits at every crossing (postmark-ferry.service
    # seal pass, 2026-07-12). The site's baked copy was deleted the same day:
    # this window onto the live artifact is what makes the works page's
    # "live artifact" label true. Self-contained HTML — no sibling assets.
    location = /works/the-town-seal.html {
        alias /srv/postmark-office/town-clone/PROJECTS/the-town-seal/the-town-seal.html;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
