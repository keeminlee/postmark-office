# Install as /etc/nginx/snippets/postmark-api.conf and include from every
# server {} that fronts the office: postmark.town (canonical — see
# nginx-postmark-town.conf) and starforge-atelier.online (legacy alias).

# OAuth discovery (RFC 9728 / 8414) — MCP clients fetch these at the ORIGIN
# root, outside /api/, so they get their own passthrough (path NOT stripped).
location /.well-known/oauth- {
    proxy_pass http://127.0.0.1:4380;
    proxy_set_header Host $host;
}

# OIDC-shaped discovery alias (ChatGPT-compat pass 2026-08-17): some MCP
# clients probe openid-configuration first or only; the office serves the
# same AS metadata there.
location /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:4380;
    proxy_set_header Host $host;
}


# ── PARTY BROWNOUT SHIELD (2026-08-29, Wright) ──────────────────────────────
# The five hot world reads, micro-cached 2s per auth token. Installed live the
# night the office browned out under the birthday crowd (every reader paying
# fold-grade CPU); backport to the deploy kit is on the post-party owed list.
# MCP and every other /api/ path are untouched below (streaming needs
# buffering off; caching needs it on — hence a separate location).
location ~ ^/api/world/(apex|conversations|walkers|state|present)$ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    rewrite ^/api(/.*)$ $1 break;
    proxy_pass http://127.0.0.1:4380;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering on;
    proxy_cache pmworld;
    proxy_cache_methods GET HEAD;
    proxy_cache_key "$host$uri$is_args$args|$http_authorization|$http_cookie";
    proxy_cache_valid 200 30s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 10s;
    proxy_cache_use_stale updating timeout;
    add_header X-PM-Cache $upstream_cache_status always;
    proxy_read_timeout 60s;
}

location /api/ {
    limit_req zone=postmark_keyless burst=240 nodelay;
    limit_req_status 429;
    error_page 429 = @postmark_keyless_rate;
    proxy_pass http://127.0.0.1:4380/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # MCP is streamable HTTP — do not buffer, do not time out mid-stream
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 1m;
}

# Courtesy: much of the MCP ecosystem mounts at the origin root, so /mcp is
# the natural guess (issue #307 — a resident's client 404'd here). Redirect
# rather than proxy: the canonical door stays /api/mcp, so OAuth discovery
# (RFC 9728 path-suffixed metadata) never forks. 308 preserves method + body.
location = /mcp {
    return 308 /api/mcp;
}
# The trailing-slash twin — some connector UIs normalize URLs with a final
# slash (FastMCP's own examples use one); /api/mcp/ already works (the
# office strips trailing slashes), so the root courtesy should too.
location = /mcp/ {
    return 308 /api/mcp;
}

# The shield answers in the office's own JSON shape (rate-limit install 2026-08-14).
location @postmark_keyless_rate {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"error":"rate","defect":"the keyless GET budget is empty; try again in 1 second.","retry_after_s":1}';
}
