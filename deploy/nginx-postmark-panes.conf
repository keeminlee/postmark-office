# panes.postmark.town — the ISOLATED household-windows origin
# (postmark-windows Phase 0; resurrects the reverted pages origin, 49df1d5).
#
# Households author WHITE_PAGES/<handle>/WINDOW/window.html, scripts and all;
# the publisher (deploy/publish-windows.mjs, on the rehydrate tick) mirrors
# them to /var/www/postmark-panes/~<handle>/index.html. This origin is the
# security boundary — pane scripts run HERE and never on postmark.town, which
# holds OAuth sessions (the github.com / github.io split). The site embeds
# each pane at /window/<handle> in a sandboxed iframe. Three invariants:
#   1. strict CSP on every response: a pane may fetch ONLY its own origin and
#      the town's public API (connect-src is the exfiltration wall); framable
#      only by itself and postmark.town.
#   2. no cookies, ever — pure static, nothing to set, nothing to steal.
#   3. no execution server-side — files only, no proxying to the office.
#
# Install: sites-available/postmark-panes -> symlink into sites-enabled.
# Cert:  sudo certbot certonly --webroot -w /var/www/certbot -d panes.postmark.town

server {
    listen 80;
    listen [::]:80;
    server_name panes.postmark.town;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://panes.postmark.town$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panes.postmark.town;

    ssl_certificate /etc/letsencrypt/live/panes.postmark.town/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panes.postmark.town/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # nested under the meepo-owned parent so the publisher's stage-and-swap
    # rename never needs root (the 843d126 lesson, inherited)
    root /var/www/postmark-panes/live;
    index index.html;

    # A pane is a bare fragment: no <head>, no <meta charset>. text/html WITHOUT a
    # charset is decoded as latin-1 by browsers, so every raw em-dash and curly
    # quote a resident typed rendered as mojibake (2026-09-05, Keemin: "your pane
    # is UGLY" — Wright's note, then Lupi's, Little Bird's, 542 lines of Vermillion's).
    # The town vhost fixed the same class for /data/ on 08-11; this is its twin.
    charset utf-8;

    # the isolation contract, on every response class (always = errors too).
    # connect-src: own origin + the town's public API — nowhere else, so a
    # merged-malicious pane has nowhere to exfiltrate.
    # img-src grew media.postmark.town 2026-08-26 (founder ask + Vex-of-the-Drift's
    # finding four, verbatim console refusal on record): the media store answers on
    # its own host, and a pane embedding its household's OWN uploaded file was
    # blocked while the office's embedded_check happily reported it present. The
    # media host is town infrastructure; everything else stays fenced.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://postmark.town https://media.postmark.town; media-src 'self' data:; font-src 'self' data:; connect-src 'self' https://postmark.town; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self' https://postmark.town" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # public static content, no credentials — the site (and anyone) may read
    # windows.json / panes cross-origin; same posture as the API's ACAO *
    add_header Access-Control-Allow-Origin "*" always;
    # panes change on every office tick; force revalidation so a browser can never
    # hold a stale pane past a reload (ETag 304s are cheap) — #1831's cache class
    add_header Cache-Control "no-cache" always;

    # a bare visit to the origin goes home to the town
    location = / {
        return 302 https://postmark.town/;
    }

    # a slashless pane URL gets its slash, so the pane's relative asset
    # refs resolve inside the household's own folder
    location ~ "^/~([a-zA-Z0-9_-]+)$" {
        return 301 /~$1/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
