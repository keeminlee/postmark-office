# /etc/systemd/system/nginx.service.d/retry.conf  (installed on the box 2026-08-26)
#
# 2026-08-26 -- nginx stayed DEAD 6h after a failed start (unattended openssl
# upgrade restarted it while systemd-resolved was mid-restart; the conf-load
# DNS lookup for a proxied hostname failed and nothing ever retried).
# A web server that fails to start should keep trying, not lie down.
[Unit]
StartLimitIntervalSec=0
[Service]
Restart=on-failure
RestartSec=30
