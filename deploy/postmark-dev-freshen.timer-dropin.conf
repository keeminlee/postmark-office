# /etc/systemd/system/postmark-dev-freshen.timer.d/nightly.conf (installed 2026-08-26)
# Founder ruling: the dev instance's default state is the sandbox/seed tag pair,
# not origin/main — so the freshen stands dev on the seed NIGHTLY instead of
# re-mirroring main every 10 minutes (a mid-day rehearsal is never yanked).
# On-demand forget: /srv/postmark-office-dev/sandbox-reset.sh
[Timer]
OnUnitActiveSec=
OnCalendar=
OnCalendar=*-*-* 08:10:00 UTC
